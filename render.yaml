# Render Blueprint for the Jarvis backend (free plan). In Render: New → Blueprint → pick this repo.
# Render asks for the two secrets on first deploy; they are never stored in the repo.
services:
  - type: web
    name: jarvis-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_SHARED_SECRET
        sync: false
